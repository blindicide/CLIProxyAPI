# cproxy-ui.net.a.blindicide.ru — cproxy analytics dashboard (+ relay API passthrough)
# Dashboard: cproxy-ui (FastAPI/uvicorn) on 127.0.0.1:24688 (systemd: cproxy-ui.service)
# API:       cproxy (CLIProxyAPI fork) on 127.0.0.1:31524 (systemd: cproxy.service)
# Install:   /etc/nginx/conf.d/cproxy-ui.net.a.blindicide.ru.conf ; cert via certbot --webroot

server {
    listen 80;
    listen [::]:80;
    server_name cproxy-ui.net.a.blindicide.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cproxy-ui.net.a.blindicide.ru;

    ssl_certificate     /etc/letsencrypt/live/cproxy-ui.net.a.blindicide.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cproxy-ui.net.a.blindicide.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/cproxy-ui.access.log;
    error_log  /var/log/nginx/cproxy-ui.error.log;

    # SSE / streaming must not be buffered
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 30s;
    client_max_body_size 64m;

    # Relay API (OpenAI + Anthropic compatible) and backend health -> cproxy
    location ~ ^/(v1|v0|health) {
        proxy_pass http://127.0.0.1:31524;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard -> cproxy-ui
    location / {
        proxy_pass http://127.0.0.1:24688;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
